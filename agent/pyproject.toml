[project]
name = "photo-agent-ai"
version = "0.1.0"
description = "Photo Agent AI Service — LangChain + Chroma + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0",
    "langchain-openai>=1.2.0",
    "chromadb>=1.5.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
reportPrivateImportUsage = false

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
