app:
  description: 个人摄影资产 AI 助手，帮助用户通过自然语言检索照片、回顾拍摄经历
  icon: 📷
  icon_background: '#FFE4E8'
  icon_type: emoji
  mode: agent-chat
  name: PhotoAgent
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.3.8@592c8252795b5f75807de2d609a03196ed02596b409f7642b4a07548c7ff57ef
    version: null
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    prompt: null
    strategy: react
    tools:
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: list_timelines
      tool_name: list_timelines
      tool_parameters: {}
      type: api
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: get_photos_by_timeline
      tool_name: get_photos_by_timeline
      tool_parameters:
        name: null
      type: api
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: get_photos_by_tags
      tool_name: get_photos_by_tags
      tool_parameters:
        tag: null
      type: api
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: get_photo_detail
      tool_name: get_photo_detail
      tool_parameters:
        id: null
      type: api
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: import_photos
      tool_name: import_photos
      tool_parameters:
        recursive: true
        source_path: null
      type: api
    - enabled: true
      notAuthor: false
      provider_id: 6549e9fe-4b0d-45bb-992d-5c6d45fe7007
      provider_name: photo_agent
      provider_type: api
      tool_label: get_import_status
      tool_name: get_import_status
      tool_parameters:
        id: null
      type: api
  annotation_reply:
    enabled: false
  chat_prompt_config:
    prompt:
    - role: system
      text: ''
  completion_prompt_config:
    conversation_histories_role:
      assistant_prefix: ''
      user_prefix: ''
    prompt:
      text: ''
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .WEBM
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      max_tokens: 2048
      stop: []
      temperature: 0.7
      top_p: 1
    mode: chat
    name: gpt-4o
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: '你是 Photo Agent，一位个人摄影资产助手。你帮助用户通过自然语言检索照片、回顾拍摄经历、分析摄影主题。


    可用能力：

    1. 通过知识库检索照片描述（语义搜索）

    2. 通过工具查询时间线和标签

    3. 基于历史作品提供创作建议

    4. 通过工具导入本地照片文件夹


    回答时：

    - 如果提到具体照片，使用 Markdown 图片语法展示照片，格式：![描述](http://host.docker.internal:8080/api/photos/{photo_id}/image)

    - 时间线查询使用 list_timelines / get_photos_by_timeline 工具

    - 标签查询使用 get_photos_by_tags 工具

    - 导入照片使用 import_photos 工具

    - 模糊描述检索使用知识库 RAG（自动）

    '
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    config: {}
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.6.0
