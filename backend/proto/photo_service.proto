syntax = "proto3";
package api;
import "google/api/annotations.proto";
import "common.proto";
option go_package = "backend/internal/pkg/api;api";

// PhotoService 照片业务扩展接口（非 genCURD 标准 CRUD 覆盖的部分）
service PhotoService {
    // 复杂条件分页查询
    rpc SearchPhotos (SearchPhotosRequest) returns (SearchPhotosResponse) {
        option (google.api.http) = {
            get: "/api/v1/photos"
        };
    }
    // 综合统计
    rpc GetPhotoStats (Empty) returns (GetPhotoStatsResponse) {
        option (google.api.http) = {
            get: "/api/v1/photos/stats"
        };
    }
    // 分段导航：返回当前筛选 + 排序下每个分段的 key/label/count/offset。
    // 必须声明在 /api/v1/photos/{id} 前，保证静态 segments 路径优先匹配。
    rpc ListPhotoSegments (ListPhotoSegmentsRequest) returns (ListPhotoSegmentsResponse) {
        option (google.api.http) = {
            get: "/api/v1/photos/segments"
        };
    }
    // 单张详情
    rpc GetPhotoDetail (GetPhotoDetailRequest) returns (GetPhotoDetailResponse) {
        option (google.api.http) = {
            get: "/api/v1/photos/{id}"
        };
    }
    // 更新标签
    rpc UpdatePhotoTags (UpdatePhotoTagsRequest) returns (Empty) {
        option (google.api.http) = {
            put: "/api/v1/photos/{id}/tags"
            body: "*"
        };
    }
    // 删除照片（含文件清理）
    rpc DeletePhoto (DeletePhotoRequest) returns (DeletePhotoResponse) {
        option (google.api.http) = {
            delete: "/api/v1/photos/{id}"
        };
    }
    // 触发连拍分组全量重算（异步）
    rpc RebuildBurstGroups (Empty) returns (RebuildBurstGroupsResponse) {
        option (google.api.http) = {
            post: "/api/v1/burst-groups/rebuild"
            body: "*"
        };
    }
    // 查询连拍分组重算进度
    rpc GetBurstGroupsStatus (Empty) returns (GetBurstGroupsStatusResponse) {
        option (google.api.http) = {
            get: "/api/v1/burst-groups/status"
        };
    }
    // 读取连拍分组两档位阈值（DB 无记录时返回配置文件默认值）
    rpc GetBurstGroupsConfig (Empty) returns (GetBurstGroupsConfigResponse) {
        option (google.api.http) = {
            get: "/api/v1/burst-groups/config"
        };
    }
    // 保存连拍分组两档位阈值（写入 app_settings）
    rpc UpdateBurstGroupsConfig (UpdateBurstGroupsConfigRequest) returns (Empty) {
        option (google.api.http) = {
            put: "/api/v1/burst-groups/config"
            body: "*"
        };
    }
    // 设置连拍组封面
    rpc SetBurstGroupCover (SetBurstGroupCoverRequest) returns (Empty) {
        option (google.api.http) = {
            put: "/api/v1/burst-groups/{group_id}/cover"
            body: "*"
        };
    }
}

// --------------------------------------------------
// SearchPhotos

message SearchPhotosRequest {
    int32 page = 1;
    int32 page_size = 2;
    string timeline = 3;
    string tag = 4;
    string keyword = 5;
    string brand = 6;
    string lens = 7;
    string focal_min = 8;
    string focal_max = 9;
    int32 iso_min = 10;
    int32 iso_max = 11;
    string shot_at_start = 12;
    string shot_at_end = 13;
    string sort_by = 14;
    string sort_order = 15;
    string burst_group_id = 16; // 按连拍组过滤（展开组内成员时使用）
    string burst_profile = 17;  // 连拍档位：fine / coarse，缺省 fine。决定 burst 字段与组过滤所用列
}

message PhotoItem {
    string id = 1;
    string filename = 2;
    string file_path = 3;
    string timeline = 4;
    string tags = 5;
    string description = 6;
    string objects = 7;
    string colors = 8;
    string scene = 9;
    string lighting = 10;
    string mood = 11;
    string composition = 12;
    int64 shot_at = 13;
    int32 width = 14;
    int32 height = 15;
    string brand = 16;
    string model = 17;
    string lens = 18;
    string focal_length = 19;
    string aperture = 20;
    int32 iso = 21;
    string exposure_time = 22;
    double latitude = 23;
    double longitude = 24;
    double altitude = 25;
    int64 imported_at = 26;
    bool has_description = 27;
    string thumbnail_url = 28;
    bool has_nef = 29;
    string burst_group_id = 30;
    bool burst_cover = 31;  // 是否为连拍组封面（组内 shot_at 最早一张）
    int32 burst_count = 32; // 连拍组内照片数（非组内照片为 0）
}

message SearchPhotosResponse {
    repeated PhotoItem items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
    int32 total_pages = 5;
}

// --------------------------------------------------
// ListPhotoSegments

message ListPhotoSegmentsRequest {
    // 复用 SearchPhotos 的筛选/排序参数（不含分页）
    string timeline = 1;
    string tag = 2;
    string keyword = 3;
    string brand = 4;
    string lens = 5;
    string focal_min = 6;
    string focal_max = 7;
    int32 iso_min = 8;
    int32 iso_max = 9;
    string shot_at_start = 10;
    string shot_at_end = 11;
    string sort_by = 12;
    string sort_order = 13;
    string burst_group_id = 14;
    string burst_profile = 15;
    string segment_mode = 16; // month / activity（按天模式的导航仍用 month）
}

message PhotoSegment {
    string key = 1;    // 分段键：month 为 "2006-01"，activity 为 timeline 值（空为未分类）
    string label = 2;  // 展示文案：month 为 "2006 年 1 月"，activity 为 timeline 名或 "未分类"
    int64 count = 3;   // 该分段照片数
    int64 offset = 4;  // 该分段首张照片在完整排序列表中的 0 基位置
}

message ListPhotoSegmentsResponse {
    repeated PhotoSegment segments = 1;
    int64 total = 2;
}

// --------------------------------------------------
// GetPhotoStats

message StatItem {
    string name = 1;
    int64 count = 2;
}

message FocalRangeStat {
    string range = 1;
    string label = 2;
    int64 count = 3;
}

message GPSStat {
    int64 with_gps = 1;
    int64 without_gps = 2;
}

message MonthlyStat {
    string month = 1;
    int64 count = 2;
}

message HourlyStat {
    int32 hour = 1;
    int64 count = 2;
}

message GetPhotoStatsResponse {
    int64 total = 1;
    int64 with_description = 2;
    int64 without_description = 3;
    repeated StatItem brands = 4;
    repeated StatItem lens = 5;
    repeated FocalRangeStat focal_ranges = 6;
    GPSStat gps = 7;
    repeated MonthlyStat monthly = 8;
    repeated HourlyStat hourly = 9;
}

// --------------------------------------------------
// GetPhotoDetail

message GetPhotoDetailRequest {
    string id = 1;
}

message GetPhotoDetailResponse {
    PhotoItem photo = 1;
    string image_url = 2;
    string description_model = 3;
    string description_time = 4;
}

// --------------------------------------------------
// UpdatePhotoTags

message UpdatePhotoTagsRequest {
    string id = 1;
    string tags = 2;
}

// --------------------------------------------------
// DeletePhoto

message DeletePhotoRequest {
    string id = 1;
}

message DeletePhotoResponse {
    string status = 1;
    string id = 2;
}

// --------------------------------------------------
// RebuildBurstGroups / GetBurstGroupsStatus

message RebuildBurstGroupsResponse {
    string status = 1; // running | already_running
}

message GetBurstGroupsStatusResponse {
    bool running = 1;
    int32 processed = 2;
    int32 total = 3;
    int32 group_count = 4;         // 精细档组数（跑完时为最终组数）
    int32 coarse_group_count = 5;  // 模糊档组数
}

// --------------------------------------------------
// GetBurstGroupsConfig / UpdateBurstGroupsConfig / SetBurstGroupCover

// BurstProfileConfig 单个档位的分组阈值
message BurstProfileConfig {
    int32 time_window_sec = 1; // 相邻两张拍摄间隔阈值（秒）
    int32 hash_threshold = 2;  // dHash 汉明距离阈值（64bit，0-64）
    double ssim_threshold = 3; // 灰区二次验证阈值
    int32 ssim_gray_min = 4;   // 触发 SSIM 验证的哈希距离下界
    int32 ssim_gray_max = 5;   // 触发 SSIM 验证的哈希距离上界
}

message GetBurstGroupsConfigResponse {
    BurstProfileConfig fine = 1;
    BurstProfileConfig coarse = 2;
}

message UpdateBurstGroupsConfigRequest {
    BurstProfileConfig fine = 1;
    BurstProfileConfig coarse = 2;
}

message SetBurstGroupCoverRequest {
    string group_id = 1;
    string photo_id = 2;
}
