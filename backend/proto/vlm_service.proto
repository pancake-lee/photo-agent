syntax = "proto3";
package api;
import "google/api/annotations.proto";
import "common.proto";
option go_package = "backend/internal/pkg/api;api";

// VlmService VLM 队列控制 + 单张照片 VLM 描述
service VlmService {
    // 启动 VLM 队列处理
    rpc StartVlmQueue (StartVlmQueueRequest) returns (StartVlmQueueResponse) {
        option (google.api.http) = {
            post: "/api/v1/vlm/queue/start"
            body: "*"
        };
    }
    // 中止 VLM 队列处理
    rpc StopVlmQueue (Empty) returns (StopVlmQueueResponse) {
        option (google.api.http) = {
            post: "/api/v1/vlm/queue/stop"
            body: "*"
        };
    }
    // 查询 VLM 队列状态
    rpc GetVlmQueueStatus (Empty) returns (GetVlmQueueStatusResponse) {
        option (google.api.http) = {
            get: "/api/v1/vlm/queue/status"
        };
    }
    // 单张照片触发 VLM 描述
    rpc DescribePhoto (DescribePhotoRequest) returns (DescribePhotoResponse) {
        option (google.api.http) = {
            post: "/api/v1/photos/{id}/describe"
            body: "*"
        };
    }
    // 查询单张照片 VLM 描述进度
    rpc GetDescribeProgress (Empty) returns (GetDescribeProgressResponse) {
        option (google.api.http) = {
            get: "/api/v1/vlm/describe/progress"
        };
    }
}

// --------------------------------------------------
// StartVlmQueue

message StartVlmQueueRequest {
    bool force = 1;
}

message StartVlmQueueResponse {
    string task_id = 1;
    int32 total = 2;
    string message = 3;
}

// --------------------------------------------------
// StopVlmQueue

message StopVlmQueueResponse {
    bool stopped = 1;
}

// --------------------------------------------------
// GetVlmQueueStatus

message VlmQueueStatus {
    bool running = 1;
    int32 total = 2;
    int32 completed = 3;
    int32 failed = 4;
    string current_file = 5;
}

message GetVlmQueueStatusResponse {
    VlmQueueStatus status = 1;
}

// --------------------------------------------------
// DescribePhoto

message DescribePhotoRequest {
    string id = 1;
}

message DescribePhotoResponse {
    bool queued = 1;
}

// --------------------------------------------------
// GetDescribeProgress

message GetDescribeProgressResponse {
    repeated string processing_ids = 1;
}
