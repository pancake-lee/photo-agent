# Photo Agent 公共配置模板
# 复制到 .local/my-config.yaml 后填写 API Key 和本机路径。
#
# 配置约定：公共能力按功能分组，服务专用值放在对应服务段。
# Http 与 Sqlite 暂为 pgo 兼容段，待 pgo 支持 Backend 配置后再统一迁移。

Log:
  Level: "debug"

# Go Backend 的 pgo 兼容配置。
Http:
  Addr: "0.0.0.0:10004"
  Timeout: 1000

Sqlite:
  Path: "./data/backend/sqlite/photo_agent.db"

Storage:
  # 项目根目录，Agent 用它解析所有相对路径。
  ProjectRoot: ".."
  # 原图存储路径。
  PhotoSrc: "./data/photos/src"
  # 压缩后的展示图存储路径。
  PhotoPath: "./data/photos/compressed"
  # 时间线活动窗口天数，活动日前后各 N 天内的照片归入该活动。
  TimelineWindowDays: 7

VLM:
  APIKey: "your-vlm-api-key"
  Model: "gpt-4o-mini"
  BaseURL: "https://api.openai.com/v1"
  # 单张图片最大尺寸，超过时自动压缩。
  MaxImageSizeMB: 0.2
  # VLM 描述生成提示词文件路径。
  Prompt: "./configs/vlm_prompt.md"

Embedding:
  APIKey: "your-embedding-api-key"
  Model: "text-embedding-3-small"
  BaseURL: "https://api.openai.com/v1"
  ContextSize: 128000
  ChunkStrategy: "none" # none | fixed_size | markdown_heading
  ChunkSize: 500
  ChunkOverlap: 50
  HeadingLevel: 2

LLM:
  APIKey: "your-llm-api-key"
  Model: "gpt-4o-mini"
  BaseURL: "https://api.openai.com/v1"
  FallbackModel: ""
  RetryEnabled: true
  RetryMaxAttempts: 3
  RequestTimeout: 60.0
  ToolMaxRounds: 20

RAG:
  AutoDistanceRatio: 1.8
  DistanceThreshold: 1.5

# 创作型查询：连拍折叠后进入 LLM 的候选数上限。
Compose:
  GroupLimit: 20
  CoverLimit: 40

Agent:
  Addr: "0.0.0.0:10005"
  # Chroma、会话/用量 SQLite、主题发现历史、聚类与 Trace。
  DataDir: "./data/agent"
  ChatDBPath: "./data/agent/sqlite/chat_sessions.db"
  # Runtime 开放目标执行的预算：最大步数 / 超时秒数 / 成本上限（元，0 不限制）。
  RuntimeMaxSteps: 12
  RuntimeTimeoutSeconds: 300
  RuntimeCostLimit: 2.0
  # Runtime 恢复预算：瞬时重试 / 带反馈修复按能力独立计数，再决策全局计数；
  # 0 关闭该恢复动作。恢复不消耗步数，但计入时长与成本。
  RuntimeRetryMax: 2
  RuntimeRepairMax: 2
  RuntimeRedecideMax: 2

Web:
  Addr: "0.0.0.0:10006"

Evaluation:
  # 可复查、应提交仓库的评估报告。
  ReportsDir: "./docs/eval/reports"
  # 主题发现规则与开发期检索回归标记。
  ConfigPath: "./configs/evaluation.yaml"

Prices:
  Path: "./configs/prices.yaml"
