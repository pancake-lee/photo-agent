syntax = "proto3";
package api;
import "google/api/annotations.proto";
import "common.proto";
import "photo_service.proto";
option go_package = "backend-new/internal/pkg/api;api";

// TagService 标签服务
service TagService {
    // 所有标签列表
    rpc ListTags (Empty) returns (ListTagsResponse) {
        option (google.api.http) = {
            get: "/api/v1/tags"
        };
    }
    // 某标签下的照片
    rpc GetPhotosByTag (GetPhotosByTagRequest) returns (GetPhotosByTagResponse) {
        option (google.api.http) = {
            get: "/api/v1/tags/{name}/photos"
        };
    }
    // 批量给照片绑定标签
    rpc BindTags (BindTagsRequest) returns (BindTagsResponse) {
        option (google.api.http) = {
            post: "/api/v1/tags/bind"
            body: "*"
        };
    }
    // 批量从照片解绑标签
    rpc UnbindTags (UnbindTagsRequest) returns (UnbindTagsResponse) {
        option (google.api.http) = {
            post: "/api/v1/tags/unbind"
            body: "*"
        };
    }
}

// --------------------------------------------------
// ListTags

message ListTagsResponse {
    repeated string tags = 1;
}

// --------------------------------------------------
// GetPhotosByTag

message GetPhotosByTagRequest {
    string name = 1;
}

message GetPhotosByTagResponse {
    string tag = 1;
    repeated PhotoItem items = 2;
    int32 total = 3;
}

// --------------------------------------------------
// BindTags

message BindTagsRequest {
    repeated string photo_ids = 1;
    string tag = 2;
}

message BindTagsResponse {
    int32 success_count = 1;
    string message = 2;
}

// --------------------------------------------------
// UnbindTags

message UnbindTagsRequest {
    repeated string photo_ids = 1;
    string tag = 2;
}

message UnbindTagsResponse {
    int32 success_count = 1;
    string message = 2;
}
